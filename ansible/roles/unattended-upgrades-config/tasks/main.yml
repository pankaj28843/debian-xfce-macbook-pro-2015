---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    install_recommends: false
  tags: [unattended-upgrades]

- name: Configure unattended-upgrades (security only)
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: "0644"
  tags: [unattended-upgrades]

- name: Configure periodic updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    mode: "0644"
  tags: [unattended-upgrades]

- name: Enable unattended-upgrades shutdown service
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: true
    state: started
  tags: [unattended-upgrades]

- name: Enable daily package-list and upgrade timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [apt-daily.timer, apt-daily-upgrade.timer]
  tags: [unattended-upgrades]
